# Deploy the pre-built site (public/) to GitHub Pages.
name: Deploy static site to GitHub Pages

on:
  # Deploy to the github-pages environment on every push to main.
  push:
    branches: ["main"]
  # Allow manual deployments from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rewrite asset URLs for project-Pages subpath
        # Source + committed public/ use root-absolute URLs (works for
        # `hugo serve` at "/"). For the project Pages subpath we prefix
        # them at deploy time only. See scripts/pages-prefix.sh.
        run: bash scripts/pages-prefix.sh /minutepapillons-org
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
